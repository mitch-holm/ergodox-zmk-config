# Receiver: Raytac MDBT50Q-RX Green (from INFO_UF2.TXT). The halves run
# SliceMK's prebuilt peripheral firmware and are not built here.
include:
  # ZMK Studio enabled: edit the keymap live at https://zmk.studio/ over USB.
  - board: raytac_mdbt50q_rx_green
    shield: slicemk_ergodox_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: receiver-studio
  # Plain build without Studio, as a fallback.
  - board: raytac_mdbt50q_rx_green
    shield: slicemk_ergodox_dongle
    artifact-name: receiver-plain
